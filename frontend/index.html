<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake Product Detector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--blue:#3b82f6;--vio:#6d4aff;--ink:#0f172a;--mut:#64748b;--line:#e6eaf3;--ok:#10a574;--okbg:#eefaf5;--bad:#e11d48;--badbg:#fff1f3;--warn:#d97706;--warnbg:#fff8eb;--grad:linear-gradient(100deg,var(--blue),var(--vio))}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:400 16px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:#f5f7fd;min-height:100vh;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:-1}
body::before{width:520px;height:520px;left:-200px;bottom:-220px;background:#e4e8fb}
body::after{width:420px;height:420px;right:-160px;top:-120px;background:#dff4ee}
nav{display:flex;align-items:center;justify-content:space-between;padding:12px clamp(16px,5vw,64px);background:rgba(255,255,255,.85);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.15rem}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{width:42px;height:42px;border-radius:12px;background:#eef2ff;display:grid;place-items:center}
.links{display:flex;gap:6px}
.links button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:12px 14px;color:var(--mut);font:500 .95rem inherit;cursor:pointer;border-bottom:2px solid transparent}
.links button[aria-current=page]{color:var(--blue);border-color:var(--blue)}
.links svg{width:20px;height:20px}
.hero{text-align:center;padding:40px 16px 26px}
.hero h1{display:inline-flex;align-items:center;gap:16px;margin:0;font-size:clamp(1.9rem,6vw,2.9rem);font-weight:800;letter-spacing:-.03em}
.hero h1 b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .logo{width:60px;height:60px;border-radius:16px}
.hero p{margin:6px 0 0;color:var(--mut)}
.card{max-width:620px;margin:0 auto 60px;background:#fff;border-radius:26px;padding:28px;box-shadow:0 24px 60px -20px rgba(70,90,160,.25);width:calc(100% - 32px)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#f1f3f9;border-radius:14px;padding:0;overflow:hidden;margin-bottom:22px}
.seg button{display:flex;align-items:center;justify-content:center;gap:10px;border:0;background:none;padding:15px;color:var(--mut);font:600 1rem inherit;cursor:pointer;border-radius:14px;transition:.25s}
.seg button[aria-selected=true]{background:var(--grad);color:#fff;box-shadow:0 8px 20px -6px rgba(90,80,240,.55)}
.seg svg{width:20px;height:20px}
h2.t{margin:0;font-size:1.1rem;font-weight:700}
.hint{margin:2px 0 14px;color:var(--mut);font-size:.9rem}
.in{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;transition:.2s}
.in:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.15)}
.in input{flex:1;min-width:0;border:0;outline:0;background:none;padding:15px 0;font:500 1rem inherit;color:var(--ink)}
.in button{border:0;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center;padding:4px;border-radius:8px}
.in button:hover{color:var(--blue)}
.in svg{width:22px;height:22px}
.clr{width:22px;height:22px;border-radius:50%!important;background:#d9dee9!important;color:#fff!important}
.clr svg{width:12px;height:12px}
.lbl{display:block;font-weight:600;font-size:.88rem;margin:16px 0 6px}
.go{width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;background:var(--grad);color:#fff;font:700 1rem inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 28px -10px rgba(90,80,240,.6);transition:transform .15s,filter .2s}
.go:hover{filter:brightness(1.07)}.go:active{transform:scale(.985)}.go:disabled{filter:grayscale(.4) brightness(.95);cursor:progress}
.go svg{width:20px;height:20px}
:focus-visible{outline:3px solid rgba(59,130,246,.45);outline-offset:2px}
.cam{position:relative;margin:14px 0 0;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:1}
.cam video{width:100%;height:100%;object-fit:cover}
.cam::after{content:"";position:absolute;inset:16%;border:3px solid #fff;border-radius:22px;box-shadow:0 0 0 999px rgba(0,0,0,.45)}
.cam i{position:absolute;left:16%;right:16%;top:16%;height:3px;background:var(--grad);box-shadow:0 0 14px var(--blue);z-index:2;animation:beam 1.8s ease-in-out infinite alternate}
@keyframes beam{to{top:84%}}
.cam button{position:absolute;right:10px;top:10px;z-index:3;border:0;border-radius:99px;padding:7px 14px;background:rgba(0,0,0,.6);color:#fff;font:600 .85rem inherit;cursor:pointer}
.hide,[hidden]{display:none!important}
.out{margin-top:22px}

/* ===== buffering (minimal) ===== */
.loader{border:1px solid var(--line);border-radius:18px;padding:14px 20px 18px;background:#fff}
.steps{margin:0;padding:0;list-style:none}
.steps li{display:flex;align-items:center;gap:12px;padding:7px 0;color:var(--mut);font-size:.95rem}
.steps .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:.25s}
.steps li.on{color:var(--ink)}
.steps li.on .dot{border-color:var(--blue);border-top-color:transparent;animation:spin .7s linear infinite}
.steps li.done{color:var(--ink)}
.steps li.done .dot{background:var(--blue);border-color:var(--blue)}
.steps li.done .dot::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
@keyframes spin{to{transform:rotate(360deg)}}
.sk{display:grid;gap:10px;margin-top:10px}
.sk b{height:12px;border-radius:6px;background:linear-gradient(90deg,#edf0f8 25%,#f8f9fd 50%,#edf0f8 75%) 0 0/300% 100%;animation:sh2 1.2s linear infinite}
.sk b:nth-child(1){width:55%}.sk b:nth-child(2){width:90%}.sk b:nth-child(3){width:70%}
@keyframes sh2{to{background-position:-300% 0}}

/* ===== result ===== */
.res{border-radius:20px;padding:18px;border:1px solid color-mix(in srgb,var(--c) 25%,#fff);background:var(--bg);animation:pop .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}}
.res.ok{--c:var(--ok);--bg:var(--okbg)}.res.bad{--c:var(--bad);--bg:var(--badbg)}.res.warn{--c:var(--warn);--bg:var(--warnbg)}
.head{display:flex;align-items:center;gap:14px;padding-bottom:14px}
.seal{position:relative;width:60px;height:60px;border-radius:50%;background:color-mix(in srgb,var(--c) 18%,#fff);display:grid;place-items:center;flex:none}
.seal::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);animation:burst .9s ease-out forwards}
@keyframes burst{from{transform:scale(.7);opacity:1}to{transform:scale(1.7);opacity:0}}
.seal i{width:42px;height:42px;border-radius:50%;background:var(--c);display:grid;place-items:center}
.seal svg{width:24px;height:24px}.seal path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.head h3{margin:0;color:var(--c);font-size:1.2rem}.head p{margin:0;color:#334155;font-size:.93rem}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid color-mix(in srgb,var(--c) 18%,#fff);padding-top:14px}
.fact{display:flex;gap:10px;padding:0 10px;border-left:1px solid color-mix(in srgb,var(--c) 18%,#fff);min-width:0}
.fact:first-child{border:0;padding-left:0}
.fact svg{width:22px;height:22px;flex:none;color:#64748b;margin-top:2px}
.fact small{display:block;color:var(--mut);font-size:.78rem}
.fact span{display:block;font-weight:500;font-size:.9rem;word-break:break-all}
.fact a{color:var(--blue);text-decoration:none}
.pill{display:flex;align-items:center;gap:8px;margin-top:14px;padding:9px 12px;border-radius:10px;background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--c);font-weight:500;font-size:.85rem}
.pill svg{width:16px;height:16px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;padding:9px;border:1px solid var(--line);background:#fff;border-radius:10px;font:600 .85rem inherit;cursor:pointer;color:var(--ink)}
.acts button:hover{border-color:var(--blue);color:var(--blue)}
.list{display:grid;gap:8px;margin-top:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font:500 .95rem inherit;text-align:left;width:100%}
.row:hover{border-color:var(--
